name: Build audio encoder

# Пересобирает libdddaudioenc.so (audioenc/build_audioenc.sh) и коммитит
# app/src/main/jniLibs/*/libdddaudioenc.so в ветку, с которой запущен.
on:
  workflow_dispatch:
  # Ручной запуск доступен только для workflow из main, поэтому сборка идет и на push правок audioenc/
  push:
    paths:
      - "audioenc/**"
      - ".github/workflows/build-audioenc.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build
        run: ./audioenc/build_audioenc.sh "$NDK_PATH"

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: libdddaudioenc
          path: app/src/main/jniLibs/

      - name: Commit libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs
          git commit -m "build(audio): rebuild libdddaudioenc (AC3/E-AC3 encoder)" || exit 0
          git push
