name: Build AV1 decoder

# Пересобирает libdav1dJNI.so (av1/build_av1.sh) и коммитит обновленный
# app/libs/lib-decoder-av1-release.aar в ветку, с которой запущен.
on:
  workflow_dispatch:
  # Ручной запуск доступен только для workflow из main, поэтому сборка идет и на push правок av1/
  push:
    paths:
      - "av1/**"
      - ".github/workflows/build-av1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build
          pip install meson

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build
        run: ./av1/build_av1.sh "$NDK_PATH"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lib-decoder-av1-release
          path: app/libs/lib-decoder-av1-release.aar

      - name: Commit AAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/lib-decoder-av1-release.aar
          git commit -m "build(av1): rebuild libdav1dJNI with 10-bit output" || exit 0
          git push
