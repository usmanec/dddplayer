name: Build FFmpeg decoder

# Пересобирает libffmpegJNI.so (ffmpeg/build_ffmpeg.sh) и коммитит обновленный
# app/libs/lib-decoder-ffmpeg-release.aar в ветку, с которой запущен.
on:
  workflow_dispatch:
  # Ручной запуск доступен только для workflow из main, поэтому сборка идет и на push правок ffmpeg/
  push:
    paths:
      - "ffmpeg/**"
      - ".github/workflows/build-ffmpeg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build
        run: ./ffmpeg/build_ffmpeg.sh "$NDK_PATH"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lib-decoder-ffmpeg-release
          path: app/libs/lib-decoder-ffmpeg-release.aar

      - name: Commit AAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/lib-decoder-ffmpeg-release.aar
          git commit -m "build(audio): rebuild libffmpegJNI with Android channel order" || exit 0
          git push
